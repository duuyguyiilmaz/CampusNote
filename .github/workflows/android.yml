name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is not committed (see README → Getting started).
      # The example file carries placeholder credentials, which is enough for the
      # Google Services plugin to run — nothing here talks to Firebase at build time.
      - name: Provide a placeholder google-services.json
        run: cp app/google-services.json.example app/google-services.json

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: campusnote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Firestore emulator is a Java process; the Node harness only drives it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Run rules tests
        working-directory: firestore-tests
        run: npm test
